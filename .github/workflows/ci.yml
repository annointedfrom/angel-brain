name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Unit tests (scorer, eval set, privacy gate)
        run: python -m pytest tests -q
      - name: Privacy scan of released files
        run: python make_public_release.py --scan-only
